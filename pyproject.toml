[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-studio-py"
version = "0.1.2"
description = "Three lines of code for a PDF with a table, a chart, and a header."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
dependencies = ["reportlab>=4"]
keywords = ["pdf", "pdf-generation", "report", "document"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Office/Business",
    "Topic :: Printing",
]

[project.optional-dependencies]
charts = ["matplotlib", "svglib"]
tables = ["pandas"]
dev = ["pytest", "pytest-cov", "ruff", "matplotlib", "pandas", "svglib"]

[project.urls]
Homepage = "https://github.com/AshayK003/pdf-studio"
Repository = "https://github.com/AshayK003/pdf-studio"
Issues = "https://github.com/AshayK003/pdf-studio/issues"
Documentation = "https://github.com/AshayK003/pdf-studio/blob/master/README.md"

[tool.setuptools.packages.find]
include = ["pdf_studio*"]

[tool.setuptools.package-data]
pdf_studio = ["fonts/*.ttf"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enforce error-catching rules. Style modernizations (UP/RUF/SIM/etc.) are
# intentionally ignored so CI flags real bugs, not formatting preferences.
select = ["E", "F", "C90"]
ignore = ["E501"]  # long lines tolerated in this codebase

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Build/demo scripts run as __main__; import ordering and complexity N/A.
"_demo.py" = ["E402"]
"build_showcase_pdf.py" = ["E402"]
