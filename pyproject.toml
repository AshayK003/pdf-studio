[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-studio-py"
version = "0.1.3"
description = "Three lines of code for a PDF with a table, a chart, and a header."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["reportlab>=4"]
keywords = ["pdf", "pdf-generation", "report", "document"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
    "Topic :: Printing",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "matplotlib", "pandas", "svglib"]

[project.urls]
Homepage = "https://github.com/AshayK003/pdf-studio"
Repository = "https://github.com/AshayK003/pdf-studio"
Issues = "https://github.com/AshayK003/pdf-studio/issues"
Documentation = "https://github.com/AshayK003/pdf-studio/blob/master/README.md"

[tool.setuptools.packages.find]
include = ["pdf_studio*"]

[tool.setuptools.package-data]
pdf_studio = ["fonts/*.ttf"]
