name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@5b3d8c2e8f7c8c8c8c8c8c8c8c8c8c8c8c8c8c8c8 # v5.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check pdf_studio/ tests/ --count

      - name: Format Check (ruff)
        run: uv run ruff format --check pdf_studio/ tests/

      - name: Test (pytest)
        run: uv run pytest tests/ -v --tb=short -q

      - name: Import check
        run: uv run python -c "from pdf_studio import Document, Style, Font; print('All pdf_studio modules importable')"